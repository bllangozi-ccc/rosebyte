name: Public distribution integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tools/check_distribution.py

      - run: python3 -m unittest discover -s examples/audit-lens -p test_tool.py -v

      - run: python3 -m unittest discover -s examples/audit-lens-shorthand -p test_example.py -v
